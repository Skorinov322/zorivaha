<!DOCTYPE html>
<html>
<head>
    <title>Тест AJAX расчета цен</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { padding: 8px; width: 200px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #dee2e6; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <h1>Тест расчета цен</h1>
    
    <form id="testForm">
        <div class="form-group">
            <label>Дата заезда:</label>
            <input type="date" id="check_in" required>
        </div>
        
        <div class="form-group">
            <label>Дата выезда:</label>
            <input type="date" id="check_out" required>
        </div>
        
        <div class="form-group">
            <label>Взрослых:</label>
            <input type="number" id="adults" value="2" min="1" max="10">
        </div>
        
        <div class="form-group">
            <label>Детей:</label>
            <input type="number" id="children" value="0" min="0" max="8">
        </div>
        
        <button type="button" onclick="testPriceCalculation()">Рассчитать цены</button>
    </form>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <script>
        // Set minimum dates
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('check_in').min = today;
        document.getElementById('check_out').min = today;
        
        // Set default dates
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('check_in').value = tomorrow.toISOString().split('T')[0];
        
        const dayAfter = new Date();
        dayAfter.setDate(dayAfter.getDate() + 3);
        document.getElementById('check_out').value = dayAfter.toISOString().split('T')[0];
        
        async function testPriceCalculation() {
            const checkIn = document.getElementById('check_in').value;
            const checkOut = document.getElementById('check_out').value;
            const adults = document.getElementById('adults').value;
            const children = document.getElementById('children').value;
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Загрузка...';
            resultDiv.className = 'result';
            
            try {
                const url = `/bookings/calculate-prices/?check_in=${checkIn}&check_out=${checkOut}&adults=${adults}&children=${children}`;
                console.log('Запрос:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Ответ:', data);
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка сервера');
                }
                
                let html = '<h3>Результат расчета:</h3>';
                
                if (data.prices && Object.keys(data.prices).length > 0) {
                    for (const [catId, priceData] of Object.entries(data.prices)) {
                        html += `<div style="margin-bottom: 15px; padding: 10px; border: 1px solid #ddd;">`;
                        html += `<h4>${priceData.category_name}</h4>`;
                        
                        if (priceData.error) {
                            html += `<p style="color: red;">Ошибка: ${priceData.error}</p>`;
                        } else {
                            html += `<p>Ночей: ${priceData.nights}</p>`;
                            html += `<p>Цена за ночь: ${priceData.price_per_night} ₽</p>`;
                            html += `<p>Итого: ${priceData.total_price} ₽</p>`;
                            
                            if (priceData.discount_amount > 0) {
                                html += `<p>Скидка: ${priceData.discount_amount} ₽ (${priceData.discount_reason})</p>`;
                            }
                            
                            if (priceData.occupancy_multiplier !== 1.0) {
                                html += `<p>Коэффициент загрузки: ${priceData.occupancy_multiplier}</p>`;
                            }
                        }
                        
                        html += `</div>`;
                    }
                } else {
                    html += '<p>Нет данных о ценах</p>';
                }
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Ошибка:', error);
                resultDiv.innerHTML = `<h3>Ошибка:</h3><p>${error.message}</p>`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
