services:
  - type: web
    name: zorivaha
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python start.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CONTACT_EMAIL
        value: zorivaha@mail.ru
      - key: CONTACT_PHONE
        value: "+7 (346) 628-70-03"
      - key: CONTACT_PHONE_SECOND
        value: "+7 (995) 097-30-59"
