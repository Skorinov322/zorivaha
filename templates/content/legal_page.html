{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}
{% block meta_description %}{{ page.title }}{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <h1 class="mb-4">{{ page.title }}</h1>
      
      <div class="d-flex flex-wrap gap-2 mb-4">
        <a href="{% url 'content:terms' %}" class="btn btn-outline-primary btn-sm {% if page.page_type == 'terms' %}active{% endif %}">
          <i class="bi bi-journal-text me-1"></i>Условия использования
        </a>
        <a href="{% url 'content:privacy' %}" class="btn btn-outline-primary btn-sm {% if page.page_type == 'privacy' %}active{% endif %}">
          <i class="bi bi-shield-lock me-1"></i>Политика конфиденциальности
        </a>
        <a href="{% url 'content:accommodation_policy' %}" class="btn btn-outline-primary btn-sm {% if page.page_type == 'accommodation' %}active{% endif %}">
          <i class="bi bi-house-heart me-1"></i>Политика проживания
        </a>
      </div>

      <div class="card">
        <div class="card-body">
          {{ page.content|safe }}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
