{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}
{% block meta_description %}{{ page.title }}{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <h1 class="mb-4">{{ page.title }}</h1>
      <div class="card">
        <div class="card-body">
          {{ page.content|safe }}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
