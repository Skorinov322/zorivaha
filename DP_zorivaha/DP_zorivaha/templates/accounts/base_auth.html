<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{% block title %}Аккаунт{% endblock %} — Зори Ваха</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --accent:   #ff8e3c;
      --bg:       #eff0f3;
      --card:     #ffffff;
      --text:     #0d0d0d;
      --muted:    rgba(13,13,13,.5);
      --border:   rgba(13,13,13,.1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 10%, rgba(255,142,60,.08) 0%, transparent 55%),
        radial-gradient(ellipse 50% 60% at 90% 90%, rgba(217,55,110,.06) 0%, transparent 55%);
      pointer-events: none;
    }

    .auth-wrapper {
      position: relative; z-index: 1;
      width: 100%;
      max-width: {% block card_width %}480px{% endblock %};
    }

    /* Logo */
    .auth-logo { text-align: center; margin-bottom: 2rem; }
    .auth-logo a { text-decoration: none; }
    .auth-logo .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #ff8e3c, #d9376e);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #0d0d0d; margin-bottom: .75rem;
      box-shadow: 0 6px 24px rgba(255,142,60,.25);
    }
    .auth-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; color: var(--text); margin: 0;
    }

    /* Card */
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 2.25rem;
      box-shadow: 0 8px 40px rgba(13,13,13,.08);
    }
    .auth-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; color: var(--text); margin-bottom: .35rem;
    }
    .auth-card .auth-subtitle {
      color: var(--muted); font-size: .875rem; margin-bottom: 1.75rem;
    }

    /* Form controls */
    .form-label {
      color: var(--muted); font-size: .85rem;
      font-weight: 500; margin-bottom: .35rem;
    }
    .form-control, .form-select {
      background: #f8f9fa !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: 10px !important;
      padding: .7rem .9rem !important;
      font-size: .9rem !important;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control::placeholder { color: rgba(13,13,13,.3) !important; }
    .form-control:focus, .form-select:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(255,142,60,.12) !important;
      background: #ffffff !important;
      outline: none !important;
    }
    .form-control.is-invalid { border-color: #dc3545 !important; }

    /* Password toggle */
    .input-group .form-control {
      border-right: none !important;
      border-radius: 10px 0 0 10px !important;
    }
    .input-group-text {
      background: #f8f9fa !important;
      border: 1px solid var(--border) !important;
      border-left: none !important;
      color: rgba(13,13,13,.4) !important;
      cursor: pointer;
      border-radius: 0 10px 10px 0 !important;
      transition: color .2s;
    }
    .input-group-text:hover { color: var(--accent) !important; }

    /* Checkbox */
    .form-check-input {
      background-color: #f8f9fa !important;
      border-color: rgba(13,13,13,.2) !important;
    }
    .form-check-input:checked {
      background-color: var(--accent) !important;
      border-color: var(--accent) !important;
    }
    .form-check-label { color: var(--muted); font-size: .85rem; }

    /* Errors */
    .invalid-feedback, .text-danger { color: #dc3545 !important; font-size: .8rem; }
    .alert-auth-error {
      background: rgba(220,53,69,.07);
      border: 1px solid rgba(220,53,69,.2);
      border-radius: 10px; color: #dc3545;
      padding: .8rem 1rem; font-size: .875rem; margin-bottom: 1.25rem;
    }

    /* Divider */
    .auth-divider {
      display: flex; align-items: center; gap: .75rem;
      margin: 1.25rem 0; color: rgba(13,13,13,.3); font-size: .8rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* Submit button */
    .btn-auth {
      width: 100%; padding: .85rem;
      background: linear-gradient(135deg, #ff8e3c, #d9376e);
      border: none; border-radius: 12px; color: #0d0d0d;
      font-size: .95rem; font-weight: 700; cursor: pointer;
      transition: opacity .2s, transform .1s; margin-top: 1.25rem;
    }
    .btn-auth:hover { opacity: .88; color: #0d0d0d; }
    .btn-auth:active { transform: scale(.99); }
    .btn-auth:disabled { opacity: .6; cursor: not-allowed; }

    /* Footer link */
    .auth-footer-link {
      text-align: center; margin-top: 1.25rem;
      font-size: .875rem; color: var(--muted);
    }
    .auth-footer-link a {
      color: var(--accent); text-decoration: none; font-weight: 500;
    }
    .auth-footer-link a:hover { text-decoration: underline; }

    /* Section label */
    .form-section-label {
      font-size: .7rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--accent); margin-bottom: .6rem; margin-top: 1.25rem;
    }
    .form-section-label:first-child { margin-top: 0; }
  </style>

  {% block extra_css %}{% endblock %}
</head>
<body>
<div class="auth-wrapper">

  <div class="auth-logo">
    <a href="/">
      <div class="logo-icon"><i class="bi bi-building"></i></div>
      <h1>Зори Ваха</h1>
    </a>
  </div>

  <div class="auth-card">
    {% block card_content %}{% endblock %}
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function togglePwd(inputId, btn) {
    const inp = document.getElementById(inputId);
    const ico = btn.querySelector('i');
    if (!inp) return;
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ico.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  }

  document.querySelectorAll('form[data-loading]').forEach(form => {
    form.addEventListener('submit', () => {
      const btn = form.querySelector('[type=submit]');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Подождите…';
      }
    });
  });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
