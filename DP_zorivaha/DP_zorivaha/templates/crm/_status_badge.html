{% if status == "active" %}
  <span style="background:rgba(40,167,69,.12);color:#28a745;border:1px solid rgba(40,167,69,.25);border-radius:6px;padding:.2rem .55rem;font-size:.72rem;white-space:nowrap">{{ label }}</span>
{% elif status == "vip" %}
  <span style="background:rgba(255,142,60,.12);color:#ff8e3c;border:1px solid rgba(255,142,60,.25);border-radius:6px;padding:.2rem .55rem;font-size:.72rem;white-space:nowrap"><i class="bi bi-star-fill me-1" style="font-size:.6rem"></i>{{ label }}</span>
{% elif status == "inactive" %}
  <span style="background:rgba(108,117,125,.1);color:#6c757d;border:1px solid rgba(108,117,125,.2);border-radius:6px;padding:.2rem .55rem;font-size:.72rem;white-space:nowrap">{{ label }}</span>
{% elif status == "blacklisted" %}
  <span style="background:rgba(220,53,69,.1);color:#dc3545;border:1px solid rgba(220,53,69,.2);border-radius:6px;padding:.2rem .55rem;font-size:.72rem;white-space:nowrap"><i class="bi bi-slash-circle me-1" style="font-size:.6rem"></i>{{ label }}</span>
{% else %}
  <span style="background:rgba(13,13,13,.06);color:rgba(13,13,13,.45);border:1px solid rgba(13,13,13,.1);border-radius:6px;padding:.2rem .55rem;font-size:.72rem">{{ label }}</span>
{% endif %}
