<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест категорий номеров - Зори Ваха</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { 
            --gold:#ff8e3c; 
            --gold-light:#ffb380; 
            --gold-dark:#e67a2a; 
            --gold-dim:rgba(255,142,60,.12); 
            --gold-border:rgba(255,142,60,.25); 
            --dark-900:#eff0f3; 
            --dark-800:#eff0f3; 
            --dark-700:#ffffff; 
            --dark-600:#ffffff; 
            --dark-500:#f6f7fa; 
            --text-primary:#0d0d0d; 
            --text-secondary:rgba(13,13,13,.65); 
            --text-muted:rgba(13,13,13,.52); 
            --text-faint:rgba(13,13,13,.25); 
            --border-subtle:rgba(13,13,13,.08); 
            --border-gold:rgba(255,142,60,.2); 
            --radius-sm:10px; 
            --radius-md:16px; 
            --radius-lg:24px; 
            --shadow-gold:0 8px 32px rgba(255,142,60,.18); 
            --ease-out:cubic-bezier(.16,1,.3,1); 
        }
        
        body { 
            font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-800);
            padding-top: 2rem;
        }
        
        .section-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem,4vw,3.25rem);
            color: var(--text-primary);
            line-height: 1.15;
            font-weight: 700;
        }
        
        .section-heading em {
            font-style: normal;
            color: var(--gold);
        }
        
        .room-card {
            background: var(--dark-600);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out), border-color .35s;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .room-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 24px 64px rgba(0,0,0,.1), 0 0 0 1px var(--gold-border);
            border-color: var(--gold-border);
        }
        
        .room-img-wrap {
            position: relative;
            height: 240px;
            overflow: hidden;
            background: var(--dark-500);
        }
        
        .room-img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark-500), var(--dark-600));
            color: var(--text-faint);
            font-size: 3rem;
        }
        
        .room-card-body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .room-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: .5rem;
        }
        
        .room-desc {
            font-size: .875rem;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 1rem;
            flex: 1;
        }
        
        .room-specs {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        
        .room-spec {
            display: flex;
            align-items: center;
            gap: .35rem;
            font-size: .8rem;
            color: var(--text-muted);
        }
        
        .room-spec i {
            color: var(--gold);
            font-size: .85rem;
        }
        
        .amenity-chips {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            margin-bottom: 1.25rem;
        }
        
        .amenity-chip {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            padding: .25rem .65rem;
            background: var(--gold-dim);
            border: 1px solid var(--gold-border);
            border-radius: 20px;
            font-size: .72rem;
            color: var(--gold);
            font-weight: 500;
        }
        
        .room-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1px solid var(--border-subtle);
            margin-top: auto;
        }
        
        .room-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold);
        }
        
        .room-price-label {
            font-size: .72rem;
            color: var(--text-muted);
            margin-top: .1rem;
        }
        
        .btn-gold-sm {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .55rem 1.25rem;
            background: var(--gold-dim);
            border: 1px solid var(--gold-border);
            color: var(--gold);
            font-size: .82rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: all .2s;
        }
        
        .btn-gold-sm:hover {
            background: rgba(255,142,60,.22);
            color: var(--gold);
        }
        
        .featured-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--gold);
            color: #0d0d0d;
            padding: .25rem .75rem;
            border-radius: 20px;
            font-size: .7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="section-heading">
                Наши <em>номера</em>
            </h1>
            <p class="text-muted mt-3">
                Тестовая страница для проверки категорий номеров
            </p>
        </div>
        
        <div class="row g-4" id="categories-container">
            <!-- Категории будут загружены через JavaScript -->
        </div>
        
        <div class="text-center mt-5">
            <div class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>
                Это тестовая страница. Данные загружаются напрямую из SQLite базы данных.
            </div>
        </div>
    </div>

    <script>
        // Тестовые данные (в реальном приложении будут загружаться с сервера)
        const categories = [
            {
                name: 'Эконом',
                slug: 'econom',
                short_description: 'Бюджетный вариант размещения с основными удобствами',
                base_price_per_night: 2500,
                max_guests: 2,
                area_sqm: 18,
                bed_type: 'single',
                is_featured: true,
                amenities: [
                    { name: 'Wi-Fi', icon: 'bi-wifi' },
                    { name: 'Телевизор', icon: 'bi-tv' }
                ]
            },
            {
                name: 'Стандарт',
                slug: 'standart',
                short_description: 'Комфортабельный номер с современными удобствами',
                base_price_per_night: 3500,
                max_guests: 2,
                area_sqm: 22,
                bed_type: 'double',
                is_featured: true,
                amenities: [
                    { name: 'Wi-Fi', icon: 'bi-wifi' },
                    { name: 'Кондиционер', icon: 'bi-thermometer-sun' },
                    { name: 'Телевизор', icon: 'bi-tv' },
                    { name: 'Мини-бар', icon: 'bi-cup-hot' }
                ]
            },
            {
                name: 'Полулюкс',
                slug: 'poluluks',
                short_description: 'Просторный номер с улучшенным интерьером',
                base_price_per_night: 4500,
                max_guests: 3,
                area_sqm: 28,
                bed_type: 'double',
                is_featured: true,
                amenities: [
                    { name: 'Wi-Fi', icon: 'bi-wifi' },
                    { name: 'Кондиционер', icon: 'bi-thermometer-sun' },
                    { name: 'Телевизор', icon: 'bi-tv' },
                    { name: 'Мини-бар', icon: 'bi-cup-hot' },
                    { name: 'Сейф', icon: 'bi-shield-check' },
                    { name: 'Балкон', icon: 'bi-door-open' }
                ]
            },
            {
                name: 'Люкс',
                slug: 'luks',
                short_description: 'Роскошный номер с панорамными видами',
                base_price_per_night: 6500,
                max_guests: 4,
                area_sqm: 35,
                bed_type: 'king',
                is_featured: false,
                amenities: [
                    { name: 'Wi-Fi', icon: 'bi-wifi' },
                    { name: 'Кондиционер', icon: 'bi-thermometer-sun' },
                    { name: 'Телевизор', icon: 'bi-tv' },
                    { name: 'Мини-бар', icon: 'bi-cup-hot' },
                    { name: 'Сейф', icon: 'bi-shield-check' },
                    { name: 'Балкон', icon: 'bi-door-open' },
                    { name: 'Джакузи', icon: 'bi-water' }
                ]
            },
            {
                name: 'Семейный',
                slug: 'semejnyj',
                short_description: 'Просторный номер для семейного отдыха',
                base_price_per_night: 5500,
                max_guests: 6,
                area_sqm: 40,
                bed_type: 'twin',
                is_featured: false,
                amenities: [
                    { name: 'Wi-Fi', icon: 'bi-wifi' },
                    { name: 'Кондиционер', icon: 'bi-thermometer-sun' },
                    { name: 'Телевизор', icon: 'bi-tv' },
                    { name: 'Мини-бар', icon: 'bi-cup-hot' },
                    { name: 'Сейф', icon: 'bi-shield-check' }
                ]
            }
        ];

        function renderCategories() {
            const container = document.getElementById('categories-container');
            
            categories.forEach(category => {
                const categoryCard = `
                    <div class="col-12 col-md-6 col-lg-4">
                        <article class="room-card">
                            <div class="room-img-wrap">
                                ${category.is_featured ? '<div class="featured-badge">Рекомендуем</div>' : ''}
                                <div class="room-img-placeholder">
                                    <i class="bi bi-image"></i>
                                </div>
                            </div>
                            <div class="room-card-body">
                                <h3 class="room-name">${category.name}</h3>
                                <p class="room-desc">${category.short_description}</p>
                                <div class="room-specs">
                                    <span class="room-spec">
                                        <i class="bi bi-people"></i>${category.max_guests} гост.
                                    </span>
                                    <span class="room-spec">
                                        <i class="bi bi-aspect-ratio"></i>${category.area_sqm} м²
                                    </span>
                                    <span class="room-spec">
                                        <i class="bi bi-moon"></i>${getBedTypeDisplay(category.bed_type)}
                                    </span>
                                </div>
                                <div class="amenity-chips">
                                    ${category.amenities.slice(0, 4).map(amenity => 
                                        `<span class="amenity-chip">
                                            <i class="${amenity.icon}"></i>${amenity.name}
                                        </span>`
                                    ).join('')}
                                </div>
                                <div class="room-footer">
                                    <div>
                                        <div class="room-price">${category.base_price_per_night.toLocaleString()} ₽</div>
                                        <div class="room-price-label">за ночь</div>
                                    </div>
                                    <a href="#" class="btn-gold-sm">
                                        Подробнее <i class="bi bi-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </article>
                    </div>
                `;
                container.innerHTML += categoryCard;
            });
        }

        function getBedTypeDisplay(bedType) {
            const types = {
                'single': 'Одна кровать',
                'double': 'Двуспальная',
                'twin': 'Две раздельные',
                'king': 'King-size',
                'bunk': 'Двухъярусная'
            };
            return types[bedType] || bedType;
        }

        // Загружаем категории при загрузке страницы
        document.addEventListener('DOMContentLoaded', renderCategories);
    </script>
</body>
</html>
