# =============================================================================
# Зори Ваха — Nginx virtual host
# Замените yourdomain.ru на ваш реальный домен
# =============================================================================

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.ru www.yourdomain.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.ru www.yourdomain.ru;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/yourdomain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.ru/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    # Limits
    client_max_body_size 20M;
    limit_conn addr 20;

    # Static files — served directly by Nginx (fastest)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        # Block script execution in uploads
        location ~* \.(php|py|pl|sh)$ { deny all; }
    }

    # Rate limit: auth
    location ~ ^/auth/(login|register)/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Rate limit: bookings API
    location ~ ^/bookings/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Health check (no logging)
    location = /health/ {
        proxy_pass http://django;
        access_log off;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /favicon.ico {
        alias /app/staticfiles/images/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # Django app
    location / {
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
